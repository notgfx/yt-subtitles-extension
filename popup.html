<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Субтитры YouTube</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 340px; margin: 0; padding: 14px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    h1 { font-size: 15px; margin: 0 0 6px; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 12px; opacity: .8; }
    select, button {
      width: 100%; box-sizing: border-box; padding: 7px 8px;
      font: inherit; border-radius: 6px; border: 1px solid #8886;
    }
    button {
      margin-top: 14px; padding: 9px; border: 0; cursor: pointer;
      background: #cc0000; color: #fff; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: default; }
    #title { margin: 4px 0 0; font-weight: 600; word-break: break-word; }
    #status { margin-top: 10px; min-height: 18px; font-size: 12px; }
    #prog { height: 2px; margin-top: 10px; border-radius: 99px; overflow: hidden; background: color-mix(in srgb, CanvasText 14%, transparent); }
    #prog > span { display: block; height: 100%; width: 0; background: #cc0000; transition: width .18s ease; }
    #prog[hidden] { display: none; }
    #status.error { color: #d93025; }
    #status.ok { color: #188038; }
    #debugLink { display: inline-block; margin-top: 12px; font-size: 11px; opacity: .6; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Скачать субтитры YouTube</h1>
  <div id="title"></div>

  <div id="controls" class="hidden">
    <label for="track">Язык субтитров</label>
    <select id="track"></select>

    <div id="translateBlock" class="hidden">
      <label for="translate">Перевести на</label>
      <select id="translate"></select>
    </div>

    <label for="format">Формат</label>
    <select id="format">
      <option value="srt">SRT (с таймкодами)</option>
      <option value="vtt">VTT (с таймкодами)</option>
      <option value="txt">TXT (только текст)</option>
    </select>

    <button id="download">Скачать</button>
  </div>

  <div id="prog" hidden><span></span></div>
  <div id="status"></div>
  <a id="debugLink" href="#">Отладка</a>

  <script src="page-fetch.js"></script>
  <script src="subs-lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
